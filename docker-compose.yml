services:
  laravel-app-api:
    build:
      context: .
      dockerfile: docker/dev/php/php.dockerfile
    volumes:
      - ./src:/var/www/html
      - ../shared-storage/public:/var/www/html/storage/app/public
      - ../shared-storage/private:/var/www/html/storage/app/private
    working_dir: /var/www/html
    command: >
      sh -c "
        mkdir -p storage/logs bootstrap/cache storage/framework/{cache,data,sessions,views} &&
        touch storage/logs/laravel.log &&
        chown -R www-data:www-data storage bootstrap/cache &&
        chmod -R ug+rwX storage bootstrap/cache &&
        php-fpm
      "
    networks:
      - proxy_network

  nginx:
    image: nginx:latest
    ports:
      - "83:80"
    volumes:
      - ./src:/var/www/html
      - ../shared-storage/public:/var/www/html/storage/app/public:ro
      - ./docker/dev/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel-app-api
    networks:
      - proxy_network

  artisan:
    build:
      context: .
      dockerfile: docker/dev/php/php.dockerfile
    volumes:
      - ./src:/var/www/html
      - ../shared-storage/public:/var/www/html/storage/app/public
      - ../shared-storage/private:/var/www/html/storage/app/private
    working_dir: /var/www/html
    entrypoint: ["php", "artisan"]
    networks:
      - proxy_network
    depends_on:
      - laravel-app-api

  composer:
    build:
      context: .
      dockerfile: docker/dev/php/php.dockerfile
    volumes:
      - ./src:/var/www/html
      - ../shared-storage/public:/var/www/html/storage/app/public
      - ../shared-storage/private:/var/www/html/storage/app/private
    working_dir: /var/www/html
    entrypoint: ["composer"]
    networks:
      - proxy_network

  # ✅ NEW: Redis (queue backend)
  redis:
    image: redis:7-alpine
    container_name: isc-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    # Optional (only if you want to access Redis from your HOST directly)
    ports:
      - "6379:6379"
    networks:
      - proxy_network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: isc-redisinsight
    depends_on:
      - redis
    ports:
      - "5540:5540"
    volumes:
      - redisinsight:/data
    networks:
      - proxy_network

  # ✅ NEW: Worker (runs the queue continuously)
  queue-worker:
    build:
      context: .
      dockerfile: docker/dev/php/php.dockerfile
    container_name: isc-queue-worker
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ../shared-storage/public:/var/www/html/storage/app/public
      - ../shared-storage/private:/var/www/html/storage/app/private
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--timeout=90"]
    depends_on:
      - redis
      - laravel-app-api
    networks:
      - proxy_network

volumes:
  redisdata:
  redisinsight:     

networks:
  proxy_network:
    external: true
