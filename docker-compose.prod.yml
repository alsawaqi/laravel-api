services:
  laravel-app-api:
    build:
      context: .
      dockerfile: docker/prod/php/php.dockerfile
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html:ro
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    networks:
      - proxy_network

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/prod/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laravel-app-api
    networks:
      - proxy_network

  # ✅ Redis (remove this service if you already have a shared Redis elsewhere)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - proxy_network

  # ✅ Queue Worker (production)
  queue-worker:
    build:
      context: .
      dockerfile: docker/prod/php/php.dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html:ro
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    depends_on:
      - laravel-app-api
      - redis
    networks:
      - proxy_network

  # ✅ Scheduler (only if you use Laravel scheduling)
  scheduler:
    build:
      context: .
      dockerfile: docker/prod/php/php.dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html:ro
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache
    command: php artisan schedule:work
    depends_on:
      - laravel-app-api
    networks:
      - proxy_network

  # ✅ Utility: run composer with SAME PHP version as app (prevents PHP 8.4 lock issues)
  composer:
    build:
      context: .
      dockerfile: docker/prod/php/php.dockerfile
    profiles: ["tools"]
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    entrypoint: ["composer"]
    networks:
      - proxy_network

  # ✅ Utility: run artisan manually (migrate, cache, etc.)
  artisan:
    build:
      context: .
      dockerfile: docker/prod/php/php.dockerfile
    profiles: ["tools"]
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache
    entrypoint: ["php", "artisan"]
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true

volumes:
  storage-data:
  cache-data:
  redis-data:
