name: Provision Thawani UAT customer (one-time)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/provision-thawani-uat.yml

permissions:
  contents: read

concurrency:
  group: production-uat-customer-provisioning
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'alsawaqi/laravel-api'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Provision verified UAT customer
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd /home/abdallah/apps/laravel-api && docker compose -f docker-compose.prod.yml exec -T laravel-app-api php" <<'PHP'
          <?php

          use App\Helpers\CodeGenerator;
          use Illuminate\Contracts\Console\Kernel;
          use Illuminate\Support\Facades\DB;
          use Illuminate\Support\Facades\Schema;

          require '/var/www/html/vendor/autoload.php';
          $app = require '/var/www/html/bootstrap/app.php';
          $app->make(Kernel::class)->bootstrap();

          $email = 'thawani.uat@avinaq.com';
          $username = 'thawani_uat_customer';
          $fullName = 'Thawani UAT Customer';
          $phoneCountryCode = '+968';
          $phone = '99999968';
          $passwordHash = '$2y$10$.cjqms/0iyGXjT315HW6buAFXdGfuQlTWeArY60NyZSFm7ky7EpXS';
          $now = now();

          $result = DB::transaction(function () use (
              $email,
              $username,
              $fullName,
              $phoneCountryCode,
              $phone,
              $passwordHash,
              $now
          ): array {
              $matchingUsers = DB::table('Secx_User_Master_T')
                  ->where(function ($query) use ($email, $username): void {
                      $query->where('email', $email)
                          ->orWhere('User_Name', $username);
                  })
                  ->lockForUpdate()
                  ->get();

              if ($matchingUsers->count() > 1) {
                  throw new RuntimeException('The requested UAT email and username belong to different accounts.');
              }

              $user = $matchingUsers->first();
              $created = $user === null;

              if ($created) {
                  $userData = [
                      'User_Id' => CodeGenerator::createCode('USR', 'Secx_User_Master_T', 'User_Id'),
                      'User_Name' => $username,
                      'email' => $email,
                      'password' => $passwordHash,
                      'Email_verified_at' => $now,
                      'created_at' => $now,
                      'updated_at' => $now,
                  ];

                  if (Schema::hasColumn('Secx_User_Master_T', 'Status')) {
                      $userData['Status'] = true;
                  }
                  if (Schema::hasColumn('Secx_User_Master_T', 'No_Login')) {
                      $userData['No_Login'] = 0;
                  }
                  if (Schema::hasColumn('Secx_User_Master_T', 'Password_Changed_Date')) {
                      $userData['Password_Changed_Date'] = $now;
                  }

                  $userId = (int) DB::table('Secx_User_Master_T')->insertGetId($userData);
              } else {
                  $userId = (int) $user->id;

                  $userUpdate = [
                      'User_Name' => $username,
                      'email' => $email,
                      'password' => $passwordHash,
                      'Email_verified_at' => $now,
                      'updated_at' => $now,
                  ];

                  if (Schema::hasColumn('Secx_User_Master_T', 'Status')) {
                      $userUpdate['Status'] = true;
                  }
                  if (Schema::hasColumn('Secx_User_Master_T', 'No_Login')) {
                      $userUpdate['No_Login'] = 0;
                  }
                  if (Schema::hasColumn('Secx_User_Master_T', 'Password_Changed_Date')) {
                      $userUpdate['Password_Changed_Date'] = $now;
                  }

                  DB::table('Secx_User_Master_T')->where('id', $userId)->update($userUpdate);
              }

              $matchingCustomers = DB::table('Customers_Master_T')
                  ->where('User_Id', $userId)
                  ->lockForUpdate()
                  ->get();

              if ($matchingCustomers->count() > 1) {
                  throw new RuntimeException('The UAT user is linked to more than one customer profile.');
              }

              $customer = $matchingCustomers->first();
              $customerData = [
                  'Customer_Type_Id' => 1,
                  'Customer_Full_Name' => $fullName,
                  'Telephone' => $phone,
                  'updated_at' => $now,
              ];

              if (Schema::hasColumn('Customers_Master_T', 'Telephone_Country_Code')) {
                  $customerData['Telephone_Country_Code'] = $phoneCountryCode;
              }
              if (Schema::hasColumn('Customers_Master_T', 'Email_Address')) {
                  $customerData['Email_Address'] = $email;
              }
              if (Schema::hasColumn('Customers_Master_T', 'Customer_Status')) {
                  $customerData['Customer_Status'] = true;
              }
              if (Schema::hasColumn('Customers_Master_T', 'deleted_at')) {
                  $customerData['deleted_at'] = null;
              }

              if ($customer === null) {
                  $customerData['Customer_Code'] = CodeGenerator::createCode(
                      'CUS',
                      'Customers_Master_T',
                      'Customer_Code'
                  );
                  $customerData['User_Id'] = $userId;
                  $customerData['created_at'] = $now;

                  $customerId = (int) DB::table('Customers_Master_T')->insertGetId($customerData);
              } else {
                  $customerId = (int) $customer->id;
                  DB::table('Customers_Master_T')->where('id', $customerId)->update($customerData);
              }

              return [
                  'created' => $created,
                  'user_id' => $userId,
                  'customer_id' => $customerId,
                  'email' => $email,
                  'username' => $username,
                  'verified' => true,
              ];
          }, 3);

          echo json_encode(['success' => true, 'result' => $result], JSON_THROW_ON_ERROR) . PHP_EOL;
          PHP
